spring:
  application:
    name: spring-app
  
  # Database Connection Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/database}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

    hikari:
      initialization-fail-timeout: 60000   # Wait DB Configuration for 60s
      connection-timeout: 30000           # Connection Timeout

  # Flyway Configuration
  flyway:
    enabled: true
    connect-retries: 10
    connect-retries-interval: 5s

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate   # Make JPA not Edit Tables(Flyway will involve)
    show-sql: true     # Show Queries on Console

# Actuator (Application Health Check) Configuration
management:
  endpoint:
    health:
      probes:
        enabled: true  # K8s Probe(Liveness/Readiness) Function
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    distribution:
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [traceId=%X{traceId:-},spanId=%X{spanId:-}] %m%n"

server:
  shutdown: graceful
